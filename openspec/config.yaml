schema: spec-driven

context: |
  Digger Doo is an ORIGINAL arcade dig-and-inflate game in the genre of classic
  tunnel-digging arcade games. It must not reuse any existing game's name,
  characters, character names, sprites, level layouts, sounds or music. Genre
  mechanics (digging tunnels through layered dirt, inflating enemies with a pump
  until they pop, dropping rocks on enemies, enemies drifting through dirt, a
  fire-breathing enemy type, the last enemy fleeing) are fine; the presentation
  (hero, enemy designs and names, palette, sounds) is ours.
  Built with the same stack and conventions as the sibling project
  neon-nibbler (dcvezzani/neon-nibbler): MOBILE FIRST for phone touchscreens
  (iOS Safari, Android Chrome) in portrait first; desktop keyboard play is a
  secondary target that must still work.
  Stack: HTML5 Canvas + vanilla JavaScript (ES modules), no build step and no
  runtime dependencies; must run from any static server (HTTPS for install).
  Audio is synthesized with the Web Audio API (no audio asset files).
  Game logic (board, digging, movement, enemy AI, rocks, scoring, timers) must
  be deterministic (fixed step, seeded RNG) and testable headlessly in Node
  without a DOM.

